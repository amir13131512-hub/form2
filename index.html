<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>فرم ثبت‌نام</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <style>
      .error-input {
        box-shadow: 0 0 5px 2px red;
      }
      .error-message {
        color: red;
        font-size: 0.9rem;
        margin-top: 4px;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
          <form id="liveForm" novalidate>
            <div class="mb-3">
              <label for="fullname" class="form-label"
                >نام و نام خانوادگی</label
              >
              <input type="text" class="form-control" id="fullname" />
              <div class="error-message" id="error-fullname"></div>
            </div>

            <div class="mb-3">
              <label for="username" class="form-label">نام کاربری</label>
              <input type="text" class="form-control" id="username" />
              <div class="error-message" id="error-username"></div>
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">شماره تلفن</label>
              <input type="tel" class="form-control" id="phone" />
              <div class="error-message" id="error-phone"></div>
            </div>

            <div class="mb-3">
              <label for="field" class="form-label">رشته تحصیلی</label>
              <input type="text" class="form-control" id="field" />
              <div class="error-message" id="error-field"></div>
            </div>

            <div class="mb-3">
              <label for="birthdate" class="form-label">تاریخ تولد</label>
              <input type="date" class="form-control" id="birthdate" />
              <div class="error-message" id="error-birthdate"></div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">رمز ورود</label>
              <input type="password" class="form-control" id="password" />
              <div class="error-message" id="error-password"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">ثبت‌نام</button>
          </form>
        </div>
      </div>
    </div>

    <script SRC="script.js">
    </script>
  </body>
</html>
